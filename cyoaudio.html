<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYOAudio</title>
  <!-- cyoaudio.com's front door until the player is built (see the
       cyoaudio.com rules in netlify.toml). Just the name, in the dark, with
       masks half-seen in the shadows behind it. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060506'/%3E%3Cpath fill-rule='evenodd' fill='%23c9a14a' d='M32 26 C26 20 14 18 6 24 C8 34 14 44 24 44 C28 44 30 40 32 38 C34 40 36 44 40 44 C50 44 56 34 58 24 C50 18 38 20 32 26 Z M13 30 C17 26 24 26 27 31 C24 35 17 35 13 30 Z M51 30 C47 26 40 26 37 31 C40 35 47 35 51 30 Z'/%3E%3C/svg%3E">
  <meta name="description" content="CYOAudio. Doors opening soon.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CYOAudio">
  <meta property="og:url" content="https://cyoaudio.com/">
  <meta property="og:title" content="CYOAudio">
  <meta property="og:description" content="Doors opening soon.">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://cyoaudio.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060506;
      --gold: #c9a14a;
      --gold-hi: #ecd08e;
      --gold-lo: #6e4f1c;
      --muted: #8a7d70;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--gold);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      overflow: hidden;
      text-align: center;
    }

    /* Masks in the shadows: the photo of the mask wall, drained of colour and
       pushed almost to black, so only their shapes come through. */
    .shadows {
      position: fixed;
      inset: -4%;
      z-index: 0;
      background: url("images/cyoaudio/masquerade.webp") 60% center / cover no-repeat;
      filter: grayscale(.8) brightness(.5) contrast(1.2) blur(1px);
      opacity: .6;
      animation: drift 50s ease-in-out infinite alternate;
    }
    .shadows::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(6, 5, 6, .55) 0%, rgba(6, 5, 6, .25) 50%, rgba(6, 5, 6, .9) 100%);
    }
    @media (max-width: 700px) {
      /* On a phone, frame the feathered mask rather than the candles. */
      .shadows { background-position: 70% center; }
    }
    @keyframes drift {
      from { transform: scale(1); }
      to { transform: scale(1.06) translateX(-1%); }
    }

    .wordmark, .soon { position: relative; z-index: 1; }

    .wordmark {
      font-family: "Cinzel Decorative", "Cinzel", serif;
      font-weight: 400;
      font-size: clamp(2.6rem, 12vw, 6rem);
      letter-spacing: .06em;
      line-height: 1;
      background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 24px rgba(201, 161, 74, .18));
      opacity: 0;
      animation: appear 2.4s ease .3s forwards;
    }

    .soon {
      font-family: "Cinzel", serif;
      font-size: clamp(.72rem, 2.6vw, .9rem);
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 26px;
      padding-left: .42em; /* balance the trailing letter-spacing */
      opacity: 0;
      animation: appear 2s ease 1.4s forwards;
    }

    @keyframes appear { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .shadows { animation: none; }
      .wordmark, .soon { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="shadows" aria-hidden="true"></div>
  <h1 class="wordmark">CYOAudio</h1>
  <p class="soon">Doors opening soon</p>
</body>
</html>
