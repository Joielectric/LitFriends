<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYOAudio</title>
  <!-- cyoaudio.com's front door until the player is built. Same site as The
       Velvet Key (see the cyoaudio.com rules in netlify.toml), so sign-in and
       the catalogue will be shared when it opens. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140b16'/%3E%3Cpath d='M14 40 L28 40 L40 22 M28 40 L40 48' stroke='%23d9a441' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='14' cy='40' r='5' fill='%23c0394a'/%3E%3Ccircle cx='46' cy='18' r='5' fill='%23d9a441'/%3E%3Ccircle cx='46' cy='50' r='5' fill='%23d9a441'/%3E%3C/svg%3E">
  <meta name="description" content="Choose-your-own-adventure audio. Listen, choose, and follow the voice that calls you. Coming soon.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CYOAudio">
  <meta property="og:url" content="https://cyoaudio.com/">
  <meta property="og:title" content="CYOAudio: Coming soon">
  <meta property="og:description" content="Choose-your-own-adventure audio. Listen, choose, and follow the voice that calls you.">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://cyoaudio.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #120a14;
      --ink: #f1e6ea;
      --muted: #a8929e;
      --gold: #d9a441;
      --crimson: #c0394a;
      --line: rgba(217, 164, 65, 0.35);
    }

    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at 50% 30%, #2a1424 0%, var(--bg) 62%) fixed, var(--bg);
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 16px;
      overflow-x: hidden;
      text-align: center;
    }

    /* The branching paths: a single voice that splits into choices. Each path
       draws itself in, then its end lights up as if it were waiting for you. */
    .paths { width: min(420px, 90vw); height: auto; margin-bottom: 28px; }
    .paths path {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw 2.4s ease forwards;
    }
    .paths path:nth-of-type(2) { animation-delay: .5s; }
    .paths path:nth-of-type(3) { animation-delay: .9s; }
    .paths path:nth-of-type(4) { animation-delay: 1.3s; }
    .paths path:nth-of-type(5) { animation-delay: 1.6s; }
    .paths .start { fill: var(--crimson); }
    .paths .end {
      fill: var(--gold);
      opacity: 0;
      animation: glow 3.2s ease-in-out infinite;
    }
    .paths .end:nth-of-type(2) { animation-delay: 2.2s; }
    .paths .end:nth-of-type(3) { animation-delay: 2.7s; }
    .paths .end:nth-of-type(4) { animation-delay: 3.2s; }
    .paths .end:nth-of-type(5) { animation-delay: 3.6s; }
    .paths .end:nth-of-type(6) { animation-delay: 4s; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes glow {
      0%, 100% { opacity: .25; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .paths path { animation: none; stroke-dashoffset: 0; }
      .paths .end { animation: none; opacity: .8; }
    }

    .wordmark {
      font-family: "Cinzel", serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 9vw, 4.2rem);
      letter-spacing: .14em;
      line-height: 1;
    }
    .wordmark span { color: var(--gold); }

    .soon {
      font-family: "Inter", system-ui, sans-serif;
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--crimson);
      margin-top: 18px;
    }

    .lede {
      font-size: clamp(1.25rem, 4vw, 1.6rem);
      font-style: italic;
      font-weight: 300;
      max-width: 34ch;
      margin: 28px auto 0;
      line-height: 1.4;
    }

    .steps {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
      list-style: none;
      font-family: "Inter", system-ui, sans-serif;
      font-size: .85rem;
      color: var(--muted);
    }
    .steps li {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
    }
    .steps b { color: var(--gold); font-weight: 500; margin-right: 6px; }

    footer {
      margin-top: 56px;
      font-family: "Inter", system-ui, sans-serif;
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.7;
    }
    footer a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 3px; }
    footer a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <svg class="paths" viewBox="0 0 420 200" aria-hidden="true">
    <path d="M30 100 C 110 100, 130 100, 180 100"/>
    <path d="M180 100 C 240 100, 260 30, 380 30"/>
    <path d="M180 100 C 250 100, 280 100, 380 100"/>
    <path d="M180 100 C 240 100, 260 170, 380 170"/>
    <path d="M280 100 C 320 100, 330 65, 380 65"/>
    <circle class="start" cx="30" cy="100" r="7"/>
    <circle class="end" cx="380" cy="30" r="6"/>
    <circle class="end" cx="380" cy="65" r="6"/>
    <circle class="end" cx="380" cy="100" r="6"/>
    <circle class="end" cx="380" cy="170" r="6"/>
    <circle class="end" cx="180" cy="100" r="4"/>
  </svg>

  <h1 class="wordmark">CYO<span>A</span>udio</h1>
  <p class="soon">Coming soon</p>

  <p class="lede">Audio stories where you choose the path. Listen, decide, and follow the voice that calls to you.</p>

  <ul class="steps">
    <li><b>I</b>Listen</li>
    <li><b>II</b>Choose</li>
    <li><b>III</b>Follow</li>
  </ul>

  <footer>
    A project from <a href="https://thevelvetkeysociety.com/">The Velvet Key</a><br>
    For adults 18+
  </footer>
</body>
</html>
