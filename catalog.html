<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/JOI_Favicon.png">
  <link rel="apple-touch-icon" href="images/JOI_Favicon.png">
  <title>Catalogue &middot; JOI Electric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12161f;
      --surface: #1a2030;
      --surface-2: #222a3e;
      --surface-3: #2b3450;
      --border: rgba(150,170,210,0.18);
      --border-mid: rgba(150,170,210,0.34);
      --text: #f2f6ff;
      --text-mid: #c2cce0;
      --text-dim: #8792ab;
      --electric: #5b8de8;
      --electric-dim: #2a4880;
      --gender: #e8a44f;
      --radius: 3px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Raleway", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.2rem 5rem; }

    /* Nav */
    .cat-nav { padding: 1.4rem 0 0; }
    .cat-nav a { font-family: "Cinzel", serif; font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); text-decoration: none; transition: color 0.2s; }
    .cat-nav a:hover { color: var(--electric); }

    /* Header */
    .cat-head { padding: 1rem 0 1.4rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .cat-eyebrow { font-family: "Cinzel", serif; font-size: 0.66rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--electric); display: block; margin-bottom: 0.6rem; }
    .cat-head h1 { font-family: "Cinzel", serif; font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: 0.06em; color: #fff; display: flex; align-items: center; gap: 0.5em; }
    .cat-logo { height: 1.25em; width: auto; flex: 0 0 auto; border-radius: 4px; }

    /* Intro: the avatar starts full-screen and rushes at the viewer as it fades.
       overflow:hidden clips the swell so it can never raise a scrollbar. */
    #intro { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
    /* Backdrop is its own layer, so lifting it does not dim the face in front of it. */
    #intro .intro-veil { position: absolute; inset: 0; background: var(--bg); animation: intro-veil 1.15s ease-out forwards; }
    /* Absolute rather than a sized grid item, so it fills the overlay outright. */
    #intro img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;
                 will-change: transform, opacity; animation: intro-rush 1.15s cubic-bezier(0.35, 0, 0.85, 0.5) forwards; }
    /* Accelerating scale reads as the face closing on the viewer, not just growing. */
    @keyframes intro-rush {
      0%   { transform: scale(1);   opacity: 1; }
      55%  { opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    /* Backdrop clears just behind the face so the catalogue is there as it goes. */
    @keyframes intro-veil { 0%, 55% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #intro { display: none; } }
    .cat-sub { color: var(--text-mid); font-size: 0.95rem; margin-top: 0.4rem; }

    /* Filter bar */
    .filters { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.9rem; }
    .search-input, .sel {
      background: var(--surface-2); border: 1px solid var(--border-mid); color: var(--text);
      font-family: "Raleway", sans-serif; font-size: 0.9rem; padding: 0.6rem 0.85rem; border-radius: var(--radius);
      outline: none; transition: border-color 0.2s;
    }
    .search-input { flex: 1; min-width: 200px; }
    .search-input:focus, .sel:focus { border-color: var(--electric); }
    .sel { cursor: pointer; }
    .sel option { background: var(--surface-2); }

    .chip-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 0.6rem; }
    .chip-label { font-family: "Cinzel", serif; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-right: 4px; }
    .chip {
      font-size: 0.74rem; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 20px;
      border: 1px solid var(--border-mid); background: transparent; color: var(--text-mid);
      cursor: pointer; transition: all 0.15s; font-family: "Raleway", sans-serif;
    }
    .chip:hover { border-color: var(--electric); color: var(--text); }
    .chip.active { background: var(--electric); border-color: var(--electric); color: #fff; }
    .chip.gender.active { background: var(--gender); border-color: var(--gender); color: #201400; }
    .chip.gender { color: var(--gender); border-color: rgba(232,164,79,0.4); }

    .meta-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0 0.8rem; gap: 1rem; }
    .count { color: var(--text-dim); font-size: 0.8rem; }
    .clear-btn {
      background: none; border: 1px solid var(--border-mid); color: var(--text-mid);
      font-family: "Cinzel", serif; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.4rem 0.9rem; border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
    }
    .clear-btn:hover { border-color: var(--electric); color: var(--text); }

    /* Table */
    .table { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .thead {
      display: grid; grid-template-columns: 92px 2fr 1.1fr 1.6fr;
      gap: 0.8rem; padding: 0.7rem 1rem; background: var(--surface-2);
      font-family: "Cinzel", serif; font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .row {
      display: grid; grid-template-columns: 92px 2fr 1.1fr 1.6fr;
      gap: 0.8rem; padding: 0.85rem 1rem; align-items: start;
      border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background 0.15s; background: var(--surface);
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--surface-2); }
    .c-date { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; padding-top: 2px; }
    .c-trt { font-size: 0.72rem; color: var(--electric); margin-top: 3px; letter-spacing: 0.03em; }
    .c-title { font-weight: 600; color: #fff; font-size: 0.98rem; line-height: 1.3; }
    .c-desc { font-size: 0.82rem; color: var(--text-dim); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .c-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .rt { font-size: 0.66rem; letter-spacing: 0.03em; padding: 1px 7px; border-radius: 12px; border: 1px solid var(--border-mid); color: var(--text-mid); }
    .rt.gender { color: var(--gender); border-color: rgba(232,164,79,0.4); }
    .c-artist { font-size: 0.84rem; color: var(--text-mid); line-height: 1.4; }
    .type-badge { font-family: "Cinzel", serif; font-size: 0.54rem; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 999px; padding: 1px 8px; margin-right: 7px; vertical-align: middle; white-space: nowrap; }
    .type-ico { font-size: 0.82em; letter-spacing: 0; margin-right: 3px; }
    .type-badge.audio  { color: #8fb4f2; border: 1px solid rgba(143,180,242,0.5);  background: rgba(91,141,232,0.14); }
    .type-badge.script { color: #e3c14f; border: 1px solid rgba(227,193,79,0.55); background: rgba(227,193,79,0.12); }
    .type-badge.story  { color: #7fd6c0; border: 1px solid rgba(127,214,192,0.55); background: rgba(127,214,192,0.12); }
    .type-badge.poem   { color: #c79bf0; border: 1px solid rgba(199,155,240,0.55); background: rgba(199,155,240,0.12); }
    .type-badge.music  { color: #6fe3c1; border: 1px solid rgba(111,227,193,0.55); background: rgba(111,227,193,0.12); }
    /* Inline player */
    .track-player { margin: 0 0 1rem; background: var(--surface-2); border: 1px solid var(--border-mid); border-radius: 6px; padding: 0.8rem 0.9rem; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
    .track-player audio { width: 100%; display: block; height: 38px; }
    .track-meta { display: flex; flex-wrap: wrap; gap: 1.4rem; margin-bottom: 1rem; }
    .track-dl {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: "Cinzel", serif; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.7rem 1.25rem; border-radius: 999px; border: 1px solid #6fe3c1;
      color: #d8fff4; text-decoration: none; background: rgba(111,227,193,0.18); transition: all 0.18s;
    }
    .track-dl:hover { background: #6fe3c1; color: #06231c; box-shadow: 0 4px 18px rgba(111,227,193,0.4); }
    .track-license { font-size: 0.82rem; color: var(--text-mid); font-style: italic; border-left: 2px solid rgba(111,227,193,0.5); padding-left: 0.7rem; margin-bottom: 1rem; }
    .row-play { color: #6fe3c1; }
    .collab-link { color: var(--electric); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
    .collab-link:hover { border-bottom-color: var(--electric); }
    .c-links { display: flex; flex-wrap: wrap; gap: 5px; }
    .plink {
      font-family: "Cinzel", serif; font-size: 0.56rem; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 4px 11px; border-radius: 999px; border: 1px solid var(--electric);
      color: #cfe0ff; text-decoration: none; white-space: nowrap; transition: all 0.18s; background: rgba(91,141,232,0.18);
    }
    .plink:hover { background: var(--electric); color: #fff; border-color: var(--electric); }

    .empty, .loading { padding: 2.5rem 1rem; text-align: center; color: var(--text-dim); font-style: italic; }

    /* Mobile: collapse to stacked cards */
    @media (max-width: 720px) {
      .thead { display: none; }
      .row { grid-template-columns: 1fr; gap: 0.4rem; padding: 1rem; }
      .c-date { padding-top: 0; }
      .c-artist::before { content: "Feat. "; color: var(--text-dim); }
    }

    /* Modal */
    .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(6,9,16,0.82); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: var(--surface); border: 1px solid var(--border-mid); border-top: 2px solid var(--electric); border-radius: var(--radius); max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 1.6rem 1.7rem; position: relative; }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.6rem; }
    .modal-title { font-family: "Cinzel", serif; font-size: 1.15rem; color: #fff; line-height: 1.3; }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 1.6rem; line-height: 1; cursor: pointer; padding: 0 0 0 1rem; }
    .modal-close:hover { color: #fff; }
    /* Labeled meta: Date Created / Total Run Time */
    .modal-meta { display: flex; flex-wrap: wrap; gap: 1.8rem; margin: 0.2rem 0 1.1rem; }
    .meta-item { display: flex; flex-direction: column; }
    .meta-label { font-family: "Cinzel", serif; font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px; }
    .meta-value { font-size: 0.98rem; font-weight: 500; color: #eef3ff; letter-spacing: 0.02em; }
    /* Description with a defined bezel */
    .modal-desc { color: var(--text); font-size: 0.92rem; line-height: 1.7; margin: 0 0 1.1rem;
      background: var(--surface-2); border: 1px solid var(--border-mid); border-radius: 6px; padding: 0.95rem 1.1rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -3px 8px rgba(0,0,0,0.38); }
    .modal-desc a { color: var(--electric); text-decoration: none; border-bottom: 1px solid rgba(91,141,232,0.45); word-break: break-word; }
    .modal-desc a:hover { color: #fff; }
    .modal-frame { margin: 0 0 1rem; border: 1px solid var(--border-mid); border-radius: 6px; background: rgba(10,14,24,0.5); padding: 6px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 6px 20px rgba(0,0,0,0.35); }
    .modal-frame img { display: block; width: 100%; height: auto; border-radius: 3px; }
    .modal-note { color: var(--text-dim); font-style: italic; font-size: 0.88rem; margin-bottom: 1rem; }
    .modal-links { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 1.1rem; }
    .modal-link {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: "Cinzel", serif; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.7rem 1.25rem; border-radius: 999px; border: 1px solid var(--electric);
      color: #eaf1ff; text-decoration: none; background: rgba(91,141,232,0.22); transition: all 0.18s;
    }
    .modal-link:hover { background: var(--electric); color: #fff; border-color: var(--electric); box-shadow: 0 4px 18px rgba(91,141,232,0.45); }
    .modal-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 1rem; }
    .modal-credits { border-top: 1px solid var(--border); padding-top: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.2rem; }
    .cred-row { font-size: 0.82rem; }
    .cred-label { display: block; color: var(--text-dim); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .cred-names { color: var(--text-mid); }

    footer { text-align: center; padding: 2.5rem 1rem 1rem; color: var(--text-dim); font-family: "Cinzel", serif; font-size: 0.6rem; letter-spacing: 0.28em; text-transform: uppercase; }
  </style>
</head>
<body>

<div id="intro" aria-hidden="true"><span class="intro-veil"></span><img src="images/JOI_Icon.png" alt="" fetchpriority="high"></div>

<div class="wrap">

  <nav class="cat-nav"><a href="index.html">&#8592; Home</a></nav>

  <header class="cat-head">
    <span class="cat-eyebrow">JOI Electric</span>
    <h1><img class="cat-logo" src="images/JOI_Icon.png" alt="">Catalogue</h1>
    <p class="cat-sub">Crafted with intention, alongside amazing collaborators and genuinely talented people. Search by title, tag, or creator. Follow the names; they lead to the people behind the work.</p>
  </header>

  <div class="filters">
    <input class="search-input" type="search" id="search" placeholder="Search titles, tags, creators…">
    <select class="sel" id="type-filter">
      <option value="">All types</option>
      <option value="audio">Audio</option>
      <option value="script">Scripts</option>
      <option value="story">Stories</option>
      <option value="poem">Poems</option>
      <option value="music">Music</option>
    </select>
    <select class="sel" id="name-filter"><option value="">All creators</option></select>
    <select class="sel" id="provider-filter"><option value="">All platforms</option></select>
    <select class="sel" id="sort-by">
      <option value="date-desc">Newest first</option>
      <option value="date-asc">Oldest first</option>
      <option value="trt-desc">Longest first</option>
      <option value="trt-asc">Shortest first</option>
    </select>
  </div>

  <div class="chip-row" id="audience-chips"></div>
  <div class="chip-row" id="tag-chips"></div>

  <div class="meta-row">
    <span class="count" id="count"></span>
    <button class="clear-btn" id="clear" style="display:none">Clear filters</button>
  </div>

  <div class="table">
    <div class="thead">
      <div>Date</div><div>Title</div><div>Creators</div><div>Links</div>
    </div>
    <div id="rows"><div class="loading">Loading catalogue…</div></div>
  </div>

</div>

<footer>JOI Electric &middot; 18+ only</footer>

<script src="/js/site-config.js"></script>
<script>
(function () {
  'use strict';

  // Fallback labels only. The live list is managed in the Content Manager and
  // arrives with the content payload; adoptProviders() merges it over these.
  var PROVIDERS = {
    soundgasm: 'Soundgasm', literotica: 'Literotica', audiochan: 'Audiochan',
    hotaudio: 'HotAudio', whyp: 'Whyp', scriptbin: 'ScriptBin', ellipsus: 'Ellipsus'
  };
  var PROVIDER_KIND = { scriptbin: 'script', ellipsus: 'script' };

  function adoptProviders(list){
    (list || []).forEach(function(p){
      if (!p || !p.key) return;
      PROVIDERS[p.key] = p.label || p.key;
      PROVIDER_KIND[p.key] = p.kind === 'script' ? 'script' : 'audio';
    });
  }
  function provVerb(key, entry){
    if (entry && isTextEntry(entry)) return 'Read on ';
    return PROVIDER_KIND[key] === 'script' ? 'Read on ' : 'Open on ';
  }
  var TOP_TAGS = 16;

  // Shared lists come from js/site-config.js (loaded above).
  var CFG = window.SITE_CONFIG;
  var GENDER_TAGS   = CFG.audienceTags;
  var CREDIT_LABELS = CFG.creditLabels;
  var CREDIT_ORDER  = CFG.creditKeys;
  var TYPE_LABELS   = CFG.typeLabels;
  var TYPE_ICONS    = CFG.typeIcons;
  var profilePage   = CFG.profilePage;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  // Keep line breaks and turn pasted URLs into links
  function richText(s){
    return esc(s).replace(/(https?:\/\/[^\s<]+)/g, function(u){
      var trail='', m=u.match(/[.,;:!?)\]]+$/);
      if (m){ trail=m[0]; u=u.slice(0,-trail.length); }
      return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'+trail;
    }).replace(/\r?\n/g, '<br>');
  }
  function safeUrl(u){
    u = String(u || '').trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
    return u.replace(/"/g, '%22');
  }
  function isGender(t){ return CFG.isAudienceTag(t); }
  function provLabel(p){ return PROVIDERS[p] || p; }

  function getLinks(e){
    if (Array.isArray(e.links) && e.links.length) return e.links;
    if (e.provider && e.url) return [{ provider: e.provider, url: e.url }];
    return [];
  }
  function allNames(e){
    var out = [], seen = {};
    var c = e.credits || {};
    CREDIT_ORDER.forEach(function(role){ (c[role] || []).forEach(function(n){ var k = n.toLowerCase(); if(!seen[k]){ seen[k]=1; out.push(n); } }); });
    return out;
  }
  function voiceNames(e){ return ((e.credits || {}).voiceArtists) || []; }

  // Collaborators → clickable names
  var COLLAB = {};
  function normName(s){ return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' '); }

  function typeOf(e){ return CFG.typeOf(e); }
  // Audio is the default and stays unbadged; everything else is called out.
  function typeBadge(e){
    var t = typeOf(e);
    if (!TYPE_LABELS[t]) return '';
    return '<span class="type-badge ' + esc(t) + '">' +
      '<span class="type-ico" aria-hidden="true">' + TYPE_ICONS[t] + '</span>' +
      esc(TYPE_LABELS[t]) + '</span>';
  }
  // Written work is read wherever it lives, so the entry's own type wins over
  // the platform's kind: a story on an audio host is still read, not listened to.
  function isTextEntry(e){ return CFG.isTextType(e); }

  // TRT is free text ("14:32", "1:05:30", "45 min"), so parse defensively and
  // return null when it cannot be read rather than guessing a length.
  function trtSeconds(e){
    var raw = String((e && e.trt) || '').trim();
    if (!raw) return null;
    var clock = raw.match(/(\d+):(\d{1,2})(?::(\d{1,2}))?/);
    if (clock){
      var a = +clock[1], b = +clock[2], c = clock[3] === undefined ? null : +clock[3];
      return c === null ? a * 60 + b : a * 3600 + b * 60 + c;
    }
    var hm = raw.match(/(?:(\d+)\s*h)?\s*(?:(\d+)\s*m)/i);
    if (hm && (hm[1] || hm[2])) return (+(hm[1] || 0)) * 3600 + (+(hm[2] || 0)) * 60;
    var hOnly = raw.match(/^(\d+(?:\.\d+)?)\s*h/i);
    if (hOnly) return Math.round(parseFloat(hOnly[1]) * 3600);
    return null;
  }

  // Entries with no readable length sink to the bottom whichever way we sort,
  // so a length sort never opens with a run of blanks.
  function sortEntries(list, mode){
    var out = list.slice();
    if (mode === 'trt-desc' || mode === 'trt-asc'){
      var dir = mode === 'trt-asc' ? 1 : -1;
      out.sort(function(a, b){
        var sa = trtSeconds(a), sb = trtSeconds(b);
        if (sa === null && sb === null) return (b.date||'').localeCompare(a.date||'');
        if (sa === null) return 1;
        if (sb === null) return -1;
        if (sa !== sb) return (sa - sb) * dir;
        return (b.date||'').localeCompare(a.date||'');
      });
      return out;
    }
    out.sort(function(a, b){
      return mode === 'date-asc'
        ? (a.date||'').localeCompare(b.date||'')
        : (b.date||'').localeCompare(a.date||'');
    });
    return out;
  }

  function entryById(id){
    if (!id) return null;
    for (var i = 0; i < ENTRIES.length; i++) if (ENTRIES[i].id === id) return ENTRIES[i];
    return null;
  }
  // An audio stores the script it filled; the script side is derived, so the
  // two directions can never disagree.
  function fillsOf(scriptId){
    return ENTRIES.filter(function(e){ return e.fills && e.fills === scriptId; });
  }
  function relLink(e){
    return '<a class="collab-link" href="#" data-goto="' + esc(e.id) + '">' + esc(e.title || 'Untitled') + '</a>';
  }
  function relatedHtml(e){
    if (typeOf(e) === 'script') {
      var fills = fillsOf(e.id);
      if (!fills.length) return '';
      return '<div class="cred-row"><span class="cred-label">Filled by</span><span class="cred-names">' +
        fills.map(relLink).join(', ') + '</span></div>';
    }
    var script = entryById(e.fills);
    if (!script) return '';
    return '<div class="cred-row"><span class="cred-label">Script</span><span class="cred-names">' +
      relLink(script) + '</span></div>';  }

  function collabHtml(name, inRow){
    var c = COLLAB[normName(name)];
    var label = c ? c.name : name;
    var page = profilePage(name, label);
    if (page) {
      return '<a class="collab-link" href="' + page + '"' + (inRow ? ' data-stop="1"' : '') + '>' + esc(label) + '</a>';
    }
    if (c && c.url) {
      return '<a class="collab-link" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer"' + (inRow ? ' data-stop="1"' : '') + '>' + esc(label) + '</a>';
    }
    return esc(label);
  }

  var els = {
    rows: document.getElementById('rows'),
    search: document.getElementById('search'),
    type: document.getElementById('type-filter'),
    name: document.getElementById('name-filter'),
    provider: document.getElementById('provider-filter'),
    audience: document.getElementById('audience-chips'),
    tags: document.getElementById('tag-chips'),
    sort: document.getElementById('sort-by'),
    count: document.getElementById('count'),
    clear: document.getElementById('clear')
  };

  var ENTRIES = [];
  var SHOW_ALL = /(?:^|[?&])all=1(?:&|$)/.test(location.search);
  var state ={ q: '', type: '', name: '', provider: '', sort: 'date-desc', tags: {} };

  function fetchData(){
    var url = window.__CATALOG_SRC__ || '/api/content';
    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      adoptProviders(data.providers);
      // The content store is shared with collaborators building their own
      // pages, so this catalogue shows only work the site's owner is credited
      // on. ?all=1 lifts that for checking the full store.
      var all = (data.entries || []).slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      ENTRIES = SHOW_ALL ? all : all.filter(function(e){ return CFG.isOwnWork(e); });
      COLLAB = {};
      (data.collaborators || []).forEach(function(c){ if (c && c.name) COLLAB[normName(c.name)] = c; });
      buildFilters();
      apply();
    }).catch(function(){
      els.rows.innerHTML = '<div class="empty">Could not load the catalogue.</div>';
    });
  }

  function buildFilters(){
    // Creator dropdown (all credited names, sorted)
    var names = {};
    ENTRIES.forEach(function(e){ allNames(e).forEach(function(n){ names[n] = 1; }); });
    Object.keys(names).sort(function(a,b){ return a.toLowerCase().localeCompare(b.toLowerCase()); })
      .forEach(function(n){ var o = document.createElement('option'); o.value = n; o.textContent = n; els.name.appendChild(o); });

    // Provider dropdown (only providers present)
    var provs = {};
    ENTRIES.forEach(function(e){ getLinks(e).forEach(function(l){ provs[l.provider] = 1; }); });
    Object.keys(provs).forEach(function(p){ var o = document.createElement('option'); o.value = p; o.textContent = provLabel(p); els.provider.appendChild(o); });

    // Tag chips
    var count = {};
    ENTRIES.forEach(function(e){ (e.tags || []).forEach(function(t){ count[t] = (count[t]||0)+1; }); });
    var all = Object.keys(count);
    var gender = all.filter(isGender);
    var other = all.filter(function(t){ return !isGender(t); }).sort(function(a,b){ return count[b]-count[a]; }).slice(0, TOP_TAGS);

    if (gender.length){
      els.audience.innerHTML = '<span class="chip-label">Audience</span>';
      gender.forEach(function(t){ els.audience.appendChild(chip(t, true)); });
    }
    if (other.length){
      els.tags.innerHTML = '<span class="chip-label">Tags</span>';
      other.forEach(function(t){ els.tags.appendChild(chip(t, false)); });
    }
  }

  function chip(t, gender){
    var b = document.createElement('button');
    b.className = 'chip' + (gender ? ' gender' : '');
    b.textContent = t;
    b.addEventListener('click', function(){
      if (state.tags[t]){ delete state.tags[t]; b.classList.remove('active'); }
      else { state.tags[t] = 1; b.classList.add('active'); }
      apply();
    });
    return b;
  }

  function matches(e){
    var q = state.q;
    if (q){
      var hay = (e.title||'') + ' ' + (e.desc||'') + ' ' + (e.shortDesc||'') + ' ' +
                (e.tags||[]).join(' ') + ' ' + allNames(e).join(' ');
      if (hay.toLowerCase().indexOf(q) === -1) return false;
    }
    if (state.type && (e.type || 'audio') !== state.type) return false;
    if (state.name && allNames(e).indexOf(state.name) === -1) return false;
    if (state.provider && !getLinks(e).some(function(l){ return l.provider === state.provider; })) return false;
    var active = Object.keys(state.tags);
    if (active.length){ var tags = e.tags || []; for (var i=0;i<active.length;i++){ if (tags.indexOf(active[i]) === -1) return false; } }
    return true;
  }

  function trackMetaHtml(e){
    var bits = '';
    if (e.tempo)   bits += '<div class="meta-item"><span class="meta-label">Tempo</span><span class="meta-value">' + esc(e.tempo) + '</span></div>';
    if (e.useCase) bits += '<div class="meta-item"><span class="meta-label">Intended Use</span><span class="meta-value">' + esc(e.useCase) + '</span></div>';
    return bits ? '<div class="track-meta">' + bits + '</div>' : '';
  }

  function rowHtml(e, idx){
    var links = getLinks(e).map(function(l){
      return '<a class="plink" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer" data-stop="1">' + esc(provLabel(l.provider)) + '</a>';
    }).join('');
    var tags = (e.tags||[]).slice(0,6).map(function(t){
      return '<span class="rt' + (isGender(t)?' gender':'') + '">' + esc(t) + '</span>';
    }).join('');
    var voices = voiceNames(e);
    var artistList = voices.length ? voices : allNames(e).slice(0,2);
    var artistStr = artistList.length ? artistList.map(function(n){ return collabHtml(n, true); }).join(', ') : '&middot;';
    return '<div class="row" data-idx="' + idx + '">' +
      '<div class="c-date">' + esc(e.date||'') + (e.trt ? '<div class="c-trt">&#9201; ' + esc(e.trt) + '</div>' : '') + '</div>' +
      '<div><div class="c-title">' + typeBadge(e) + esc(e.title||'Untitled') + '</div>' +
        (e.shortDesc || e.desc ? '<div class="c-desc">' + esc(e.shortDesc||e.desc) + '</div>' : '') +
        (tags ? '<div class="c-tags">' + tags + '</div>' : '') +
      '</div>' +
      '<div class="c-artist">' + artistStr + '</div>' +
      '<div class="c-links">' + (links || '<span class="c-date">&middot;</span>') + '</div>' +
    '</div>';
  }

  function apply(){
    var filtered = sortEntries(ENTRIES.filter(matches), state.sort);
    var has = state.q || state.type || state.name || state.provider || Object.keys(state.tags).length;
    els.clear.style.display = has ? '' : 'none';
    els.count.textContent = filtered.length + ' of ' + ENTRIES.length + ' works' +
      (SHOW_ALL ? ' — showing every creator' : '');
    if (!filtered.length){ els.rows.innerHTML = '<div class="empty">No matching works.</div>'; return; }
    els.rows.innerHTML = filtered.map(rowHtml).join('');
    // wire rows
    var rowEls = els.rows.querySelectorAll('.row');
    filtered.forEach(function(e, i){
      rowEls[i].addEventListener('click', function(ev){
        if (ev.target.closest('[data-stop]')) return; // link click
        openModal(e);
      });
    });
  }

  // Modal
  var overlay = null;
  function closeModal(){ if (overlay){ overlay.remove(); overlay = null; document.body.style.overflow=''; } }
  function openModal(e){
    closeModal();
    document.body.style.overflow = 'hidden';
    var links = getLinks(e).map(function(l){
      return '<a class="modal-link" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
        provVerb(l.provider, e) + esc(provLabel(l.provider)) + '</a>';
    }).join('');
    var tags = (e.tags||[]).map(function(t){ return '<span class="rt' + (isGender(t)?' gender':'') + '">' + esc(t) + '</span>'; }).join('');
    var related = relatedHtml(e);
    var credits = '';
    var c = e.credits || {};
    CREDIT_ORDER.forEach(function(role){
      if ((c[role]||[]).length) credits += '<div class="cred-row"><span class="cred-label">' + CREDIT_LABELS[role] + '</span><span class="cred-names">' + c[role].map(function(n){ return collabHtml(n, false); }).join(', ') + '</span></div>';
    });

    overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.addEventListener('click', function(ev){ if (ev.target === overlay) closeModal(); });
    var meta = '';
    if (e.date) meta += '<div class="meta-item"><span class="meta-label">Date Created</span><span class="meta-value">' + esc(e.date) + '</span></div>';
    if (e.trt) meta += '<div class="meta-item"><span class="meta-label">Total Run Time</span><span class="meta-value">&#9201; ' + esc(e.trt) + '</span></div>';

    overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><div class="modal-title">' + typeBadge(e) + esc(e.title||'Untitled') + '</div>' +
        '<button class="modal-close" aria-label="Close">&times;</button></div>' +
      (meta ? '<div class="modal-meta">' + meta + '</div>' : '') +
      (safeUrl(e.track) ? '<div class="track-player"><audio controls preload="none" src="' + safeUrl(e.track) + '"></audio></div>' : '') +
      (trackMetaHtml(e)) +
      (safeUrl(e.image) ? '<div class="modal-frame"><img src="' + safeUrl(e.image) + '" alt="' + esc(e.title || '') + '" loading="lazy"></div>' : '') +
      (e.desc ? '<div class="modal-desc">' + richText(e.desc) + '</div>' : '') +
      (safeUrl(e.track) ? '<div class="modal-links"><a class="track-dl" href="' + safeUrl(e.track) + '" download><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download track</a></div>' : '') +
      (e.license ? '<div class="track-license">' + esc(e.license) + '</div>' : '') +
      (links ? '<div class="modal-links">' + links + '</div>' : (safeUrl(e.track) ? '' : '<div class="modal-note">No links yet.</div>')) +
      (tags ? '<div class="modal-tags">' + tags + '</div>' : '') +
      (credits || related ? '<div class="modal-credits">' + related + credits + '</div>' : '') +
    '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('.modal-close').addEventListener('click', closeModal);
    // Jump straight from an audio to its script, or from a script to a fill.
    Array.prototype.forEach.call(overlay.querySelectorAll('[data-goto]'), function(a){
      a.addEventListener('click', function(ev){
        ev.preventDefault();
        var target = entryById(a.getAttribute('data-goto'));
        if (target) openModal(target);
      });
    });
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

  // Events
  els.search.addEventListener('input', function(e){ state.q = e.target.value.toLowerCase().trim(); apply(); });
  els.type.addEventListener('change', function(e){ state.type = e.target.value; apply(); });
  els.name.addEventListener('change', function(e){ state.name = e.target.value; apply(); });
  els.provider.addEventListener('change', function(e){ state.provider = e.target.value; apply(); });
  els.sort.addEventListener('change', function(e){ state.sort = e.target.value; apply(); });
  els.clear.addEventListener('click', function(){
    state = { q:'', type:'', name:'', provider:'', sort: state.sort, tags:{} };
    els.search.value = ''; els.type.value = ''; els.name.value = ''; els.provider.value = '';
    document.querySelectorAll('.chip.active').forEach(function(c){ c.classList.remove('active'); });
    apply();
  });

  // Drop the intro once it has played. It is pointer-events:none throughout, so
  // it never blocks the page even in the window before this fires; the timeout
  // is a backstop for the case where the animation never starts.
  (function introTeardown(){
    var intro = document.getElementById('intro');
    if (!intro) return;
    var clear = function(){ if (intro && intro.parentNode) intro.parentNode.removeChild(intro); };
    intro.addEventListener('animationend', clear, { once: true });
    setTimeout(clear, 2500);
  })();

  fetchData();
})();
</script>
</body>
</html>
