<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYOAudio · Demo</title>
  <!-- cyoaudio.com/demo (see the cyoaudio.com rules in netlify.toml): a first
       look at the player. Three Audiochan audios played in order, with a
       Play next between them. Unlisted while the site is coming soon. -->
  <meta name="robots" content="noindex">
  <meta name="description" content="A first look at the CYOAudio player.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060506'/%3E%3Cpath fill-rule='evenodd' fill='%23c9a14a' d='M32 26 C26 20 14 18 6 24 C8 34 14 44 24 44 C28 44 30 40 32 38 C34 40 36 44 40 44 C50 44 56 34 58 24 C50 18 38 20 32 26 Z M13 30 C17 26 24 26 27 31 C24 35 17 35 13 30 Z M51 30 C47 26 40 26 37 31 C40 35 47 35 51 30 Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* The age gate (js/age-gate.js) reads these too, so it wears the same gold. */
    :root {
      --bg: #060506;
      --surface: #0f0c0d;
      --surface-2: #171213;
      --border: rgba(201, 161, 74, .22);
      --gold: #c9a14a;
      --gold-hi: #ecd08e;
      --gold-lo: #6e4f1c;
      --accent: #c9a14a;
      --electric: #c9a14a;
      --text: #efe6d6;
      --text-dim: #8a7d70;
      --radius: 14px;
    }

    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.12rem;
      min-height: 100vh;
      padding: 40px 16px 64px;
    }

    .shadows {
      position: fixed; inset: -4%; z-index: 0;
      background: url("/images/cyoaudio/masquerade.webp") 60% center / cover no-repeat;
      filter: grayscale(.8) brightness(.35) contrast(1.2) blur(2px);
      opacity: .5;
    }
    .shadows::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(6,5,6,.6) 0%, rgba(6,5,6,.85) 60%, rgba(6,5,6,.97) 100%);
    }

    main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; }
    .wordmark {
      font-family: "Cinzel Decorative", "Cinzel", serif; font-weight: 400;
      font-size: clamp(2rem, 8vw, 3.2rem); letter-spacing: .06em; line-height: 1;
      background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-decoration: none; display: inline-block;
    }
    .eyebrow {
      font-family: "Cinzel", serif; font-size: .72rem; letter-spacing: .42em; text-transform: uppercase;
      color: var(--text-dim); margin-top: 14px; padding-left: .42em;
    }
    .intro { color: var(--text-dim); font-style: italic; margin-top: 12px; }

    /* The path: every part of the story, with where you are in it. */
    .path { display: flex; gap: 8px; margin-bottom: 16px; }
    .step {
      flex: 1 1 0; min-width: 0; text-align: left; cursor: pointer;
      background: rgba(15,12,13,.75); border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 11px; color: var(--text-dim); font: inherit; font-size: .92rem;
      transition: border-color .2s, color .2s, background .2s;
    }
    .step:hover { border-color: rgba(201,161,74,.5); color: var(--text); }
    .step .n { display: block; font-family: "Cinzel", serif; font-size: .64rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-lo); margin-bottom: 2px; }
    .step .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step.done .n::after { content: " · heard"; }
    .step.now { border-color: var(--gold); color: var(--text); background: rgba(201,161,74,.08); }
    .step.now .n { color: var(--gold); }

    /* The stage: the part playing now. */
    .stage {
      background: rgba(15,12,13,.85); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    .now-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .now-title { font-family: "Cinzel", serif; font-weight: 600; font-size: clamp(1.1rem, 3.6vw, 1.4rem); color: var(--gold-hi); letter-spacing: .02em; }
    .now-meta { color: var(--text-dim); font-size: .95rem; }
    .player { position: relative; border-radius: 10px; overflow: hidden; background: #0b0809; }
    .player iframe { display: block; width: 100%; height: 300px; border: 0; }
    .source { margin-top: 8px; font-size: .9rem; color: var(--text-dim); }
    .source a { color: var(--gold); }

    .next-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .hint { color: var(--text-dim); font-style: italic; font-size: .98rem; flex: 1 1 260px; }
    .btn {
      font-family: "Cinzel", serif; font-weight: 600; font-size: .9rem; letter-spacing: .08em;
      border-radius: 999px; padding: 12px 22px; cursor: pointer; border: 1px solid var(--gold);
      background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, #a7822f); color: #1a1206;
      box-shadow: 0 8px 26px rgba(201,161,74,.25); transition: transform .15s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(201,161,74,.35); }
    .btn:active { transform: scale(.98); }
    .btn .sub { display: block; font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: .86rem; letter-spacing: 0; text-transform: none; opacity: .8; margin-top: 1px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-quiet { background: none; color: var(--gold); box-shadow: none; border-color: var(--border); }
    .btn-quiet:hover { border-color: var(--gold); box-shadow: none; }

    .note { margin-top: 26px; color: var(--text-dim); font-size: .92rem; line-height: 1.55; text-align: center; }

    @media (max-width: 560px) {
      .path { flex-direction: column; }
      .player iframe { height: 330px; }
      .next-row .btn { width: 100%; }
      .btn .sub { max-width: none; }
    }
  </style>
  <script src="/js/age-gate.js"></script>
</head>
<body>
  <div class="shadows" aria-hidden="true"></div>
  <main>
    <header>
      <a class="wordmark" href="/">CYOAudio</a>
      <p class="eyebrow">A first look</p>
      <p class="intro">Three parts, one after another. Press play, and when a part is done, go on to the next.</p>
    </header>

    <nav class="path" id="path" aria-label="Parts"></nav>

    <section class="stage" aria-live="polite">
      <div class="now-head">
        <h1 class="now-title" id="now-title"></h1>
        <span class="now-meta" id="now-meta"></span>
      </div>
      <div class="player"><iframe id="player" title="Audio player" allow="autoplay; encrypted-media" loading="eager"></iframe></div>
      <p class="source" id="source"></p>
      <div class="next-row">
        <p class="hint" id="hint"></p>
        <button type="button" class="btn" id="next"></button>
      </div>
    </section>

    <p class="note">Audio plays from Audiochan, which hosts it; each part is linked there too.</p>
  </main>

  <script>
  (function () {
    'use strict';

    // The story, in order. A branching story gives a part more than one way
    // on (next: ['a', 'b']); this one runs straight through. Lengths are in
    // seconds, as Audiochan reports them.
    var PARTS = [
      { slug: '3aJPLB5Zs6PaGRco4K', title: 'Welcome To My Toy Box', length: 106 },
      { slug: '788ldWIiMdGkyM6FFE', title: 'Instructions III - Voice / SFX Only', length: 1418 },
      { slug: 'RghLGVPJ4be5Kl4Csi', title: 'Need You Now', length: 903 }
    ];
    var CREDIT = 'JOI Electric';

    var at = 0, heard = {};
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function mins(sec) { var m = Math.floor(sec / 60), s = Math.round(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; }

    function renderPath() {
      $('path').innerHTML = PARTS.map(function (p, i) {
        var cls = 'step' + (i === at ? ' now' : '') + (heard[i] && i !== at ? ' done' : '');
        return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (i === at ? ' aria-current="step"' : '') + '>' +
          '<span class="n">Part ' + (i + 1) + '</span><span class="t">' + esc(p.title) + '</span></button>';
      }).join('');
    }

    function show(i) {
      heard[at] = true;
      at = i;
      var p = PARTS[i], last = i === PARTS.length - 1;
      $('now-title').textContent = p.title;
      $('now-meta').textContent = 'Part ' + (i + 1) + ' of ' + PARTS.length + ' · ' + mins(p.length) + ' · ' + CREDIT;
      $('player').src = 'https://audiochan.com/embed/a/' + encodeURIComponent(p.slug);
      $('source').innerHTML = '<a href="https://audiochan.com/a/' + encodeURIComponent(p.slug) + '" target="_blank" rel="noopener">Open this part on Audiochan</a>';
      var btn = $('next');
      if (last) {
        btn.className = 'btn btn-quiet';
        btn.innerHTML = 'Start over';
        $('hint').textContent = 'This is the last part. Thank you for listening.';
      } else {
        btn.className = 'btn';
        btn.innerHTML = 'Play next &#9656;<span class="sub">' + esc(PARTS[i + 1].title) + '</span>';
        $('hint').textContent = 'Press play above. When this part ends, carry on with the next.';
      }
      renderPath();
    }

    $('next').addEventListener('click', function () {
      show(at === PARTS.length - 1 ? 0 : at + 1);
      $('player').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    $('path').addEventListener('click', function (e) {
      var b = e.target.closest('.step');
      if (b) show(+b.dataset.i);
    });

    show(0);
  })();
  </script>
</body>
</html>
