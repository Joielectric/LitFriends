[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# One page renders every creator profile, so /profile/<slug> is served from
# profile.html rather than a file per creator.
#
# It goes through a function rather than a plain rewrite because a social
# scraper does not run the page's JavaScript: the function fetches the same
# shell and splices this creator's Open Graph tags into it, so a shared link
# previews as them rather than as an empty page titled "Profile". The URL the
# creator shares is still the URL that stays in the bar.
#
# The route is declared by the function itself (netlify/functions/profile-page.js,
# `export const config = { path: "/profile/*" }`), so there is no redirect rule
# here to drift out of step with it.

# The Velvet Key's home was consenting-adults.html, the collective's old name.
# Links to it are out there, so both spellings land on the page it became.
[[redirects]]
  from = "/consenting-adults.html"
  to = "/the-velvet-key.html"
  status = 301
  force = true

[[redirects]]
  from = "/consenting-adults"
  to = "/the-velvet-key.html"
  status = 301
  force = true

# Hand-built collaborator pages that have been taken down. The files stay in
# /profiles so a page can come back by deleting its rules (and restoring its
# `page` in js/site-config.js, its card in the-velvet-key.html and its line
# in js/nav.js); `force` is what stops Netlify serving the file that is still
# there. Each page has two rules, with and without .html, since Netlify serves
# both. They go to the collective's home: a creator's /profile/<slug> only
# works while that profile is published. 302, since none of this need be for good.
[[redirects]]
  from = "/profiles/loona-licks.html"
  to = "/the-velvet-key.html"
  status = 302
  force = true

