<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/JOI_Favicon.png">
  <link rel="apple-touch-icon" href="/images/JOI_Favicon.png">
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>if ('IntersectionObserver' in window) document.documentElement.classList.add('reveal-on');</script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/electric.css">
  <link rel="stylesheet" href="/css/profile.css">
  <style>
    /* One page renders every creator profile. The site's own look is the
       default (css/electric.css + css/profile.css); a creator who picks
       another theme gets its palette from css/themes.css on <body data-theme>,
       and the names profile.css builds on are pointed at it here. Values that
       refer to other properties are declared again on <body>, since a var()
       set on :root resolves against :root's values, not the theme's. */
    :root { --accent: #39d5ff; --accent-2: #8b5cff; --glow: 139,92,255; }
    html body[data-theme] {
      --bg-2: var(--surface); --line: var(--border); --line-hi: var(--border-mid);
      --accent-2: var(--accent); --cyan: var(--accent); --violet: var(--accent); --pink: var(--accent);
      --volt: linear-gradient(120deg, var(--accent), var(--accent));
      --silver-hi: #fff; --radius: 18px;
    }
    body[data-theme="electric"] { --glow: 91,141,232; }
    body[data-theme="ember"]    { --glow: 217,116,63; }
    body[data-theme="orchid"]   { --glow: 180,120,232; }
    body[data-theme="moss"]     { --glow: 95,191,148; }
    body[data-theme="noir"]     { --glow: 201,201,210; }
    body[data-theme="rose"]     { --glow: 232,114,154; }
    body[data-theme="ocean"]    { --glow: 63,180,217; }
    body[data-theme="gold"]     { --glow: 217,176,74; }
    body[data-theme="crimson"]  { --glow: 224,72,94; }
    body[data-theme="midnight"] { --glow: 124,140,255; }
    body[data-theme="ice"]      { --glow: 159,212,245; }
    body[data-theme="daylight"] { --glow: 47,98,214; }

    /* Daylight is the one light theme, and css/electric.css and
       css/profile.css were written for dark pages: white-alpha glass and
       lines, dark bars, dark text on the accent, a white-to-accent title.
       Those are put right here for it alone, so the dark themes never see
       any of this. Text on the accent is white, because the accent is always
       deep enough for it (see js/themes.js). */
    html:has(body[data-theme="daylight"]) { color-scheme: light; }
    html body[data-theme="daylight"] {
      --glass: var(--surface); --glass-hi: var(--surface-2);
      --silver-hi: var(--text);
    }
    body[data-theme="daylight"] .glass, body[data-theme="daylight"] .update,
    body[data-theme="daylight"] .link, body[data-theme="daylight"] .ag-row { box-shadow: 0 1px 3px rgba(28,32,52,0.06); }
    body[data-theme="daylight"]::before {
      background:
        radial-gradient(60% 45% at 12% 0%, rgba(var(--glow),0.12) 0%, transparent 70%),
        radial-gradient(55% 45% at 92% 8%, rgba(var(--glow),0.07) 0%, transparent 70%);
    }
    body[data-theme="daylight"] .topbar::before { background: rgba(246,244,239,0.82); }
    body[data-theme="daylight"] .bottombar { background: rgba(255,255,255,0.9); box-shadow: 0 10px 30px rgba(28,32,52,0.16); }
    body[data-theme="daylight"] .topnav a.vk-link, body[data-theme="daylight"] .bottombar a.vk-link { color: #a3294a; }
    body[data-theme="daylight"] .topnav a.vk-link:hover { color: #7a1834; background: rgba(176,40,74,0.1); }
    body[data-theme="daylight"] .head h1 { background-image: linear-gradient(120deg, var(--text) 0%, var(--accent) 60%, var(--accent-2) 100%); }
    body[data-theme="daylight"] .btn-primary,
    body[data-theme="daylight"] .ag-own-tag.active,
    body[data-theme="daylight"] .ag-plink:hover,
    body[data-theme="daylight"] .ag-modal-open-btn,
    body[data-theme="daylight"] .ag-modal-open-btn:hover { color: #fff; }
    body[data-theme="daylight"] .btn-glass:hover { background: var(--surface-3); }
    body[data-theme="daylight"] .link-icon img { border-radius: 7px; box-shadow: 0 0 0 1px var(--line); }
    body[data-theme="daylight"] .ag-tag.ag-tag-gender { color: #8a4b00; background: rgba(230,150,40,0.12); border-color: rgba(200,120,20,0.45); }
    body[data-theme="daylight"] .ag-type-audio  { color: #2c58b8; border-color: rgba(44,88,184,0.4); background: rgba(44,88,184,0.08); }
    body[data-theme="daylight"] .ag-type-script { color: #81620a; border-color: rgba(150,115,10,0.45); background: rgba(190,150,20,0.1); }
    body[data-theme="daylight"] .ag-type-story  { color: #0f6d5a; border-color: rgba(15,109,90,0.4); background: rgba(15,109,90,0.08); }
    body[data-theme="daylight"] .ag-type-poem   { color: #7036b0; border-color: rgba(112,54,176,0.4); background: rgba(112,54,176,0.08); }
    body[data-theme="daylight"] .ag-type-music  { color: #0c7258; border-color: rgba(12,114,88,0.4); background: rgba(12,114,88,0.08); }
    body[data-theme="daylight"] .ag-overlay { background: rgba(25,28,40,0.45); }
    body[data-theme="daylight"] .ag-modal { box-shadow: 0 30px 80px rgba(28,32,52,0.28); }
    body[data-theme="daylight"] .ag-modal-title { color: var(--text); }
    body[data-theme="daylight"] .ag-modal-desc a { color: var(--accent); }
    body[data-theme="daylight"] .ag-modal-desc a:hover,
    body[data-theme="daylight"] .ag-collab-link:hover { color: var(--text); }
    body[data-theme="daylight"] .ag-modal-frame { background: var(--surface-2); }
    body[data-theme="daylight"] .ag-track-dl { color: #0c5a46; border-color: #2aa883; background: rgba(42,168,131,0.1); }
    body[data-theme="daylight"] .ag-track-dl:hover { background: #2aa883; color: #fff; }
    body[data-theme="daylight"] .ag-filter-select option { background: #fff; color: var(--text); }
    body[data-theme="daylight"][data-bg="banner"]::before { opacity: 0.5; }
    body[data-theme="daylight"][data-bg="banner"]::after { background: linear-gradient(180deg, rgba(255,255,255,0.35), var(--bg) 85%); }

    /* What sits behind the page (the creator's "Background" choice). The soft
       glow from css/profile.css is the default; "plain" drops it, and "banner"
       lays their banner across the whole page, blurred and darkened so the
       words on top stay easy to read. */
    body[data-bg="plain"]::before { display: none; }
    body[data-bg="banner"]::before {
      inset: -60px; z-index: 0;
      background: var(--bg-image) center / cover no-repeat;
      filter: blur(28px) saturate(1.1);
      opacity: 0.55;
    }
    body[data-bg="banner"]::after {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.25), var(--bg) 85%);
      opacity: 0.85;
    }

    .wrap { max-width: 860px; }
    .banner { aspect-ratio: 3 / 1; border-radius: 24px; border: 1px solid var(--line); background-size: cover; background-position: center; margin-top: 0.4rem; }
    @media (max-width: 560px) { .banner { aspect-ratio: 2 / 1; border-radius: 18px; } }
    .head { text-align: center; padding: 1.4rem 0 0.6rem; }
    .banner + .head { margin-top: -64px; }
    .avatar {
      width: 112px; height: 112px; border-radius: 28px; object-fit: cover; background: var(--bg);
      box-shadow: 0 0 0 4px var(--bg), 0 0 40px rgba(var(--glow),0.45);
    }
    .head h1 {
      font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05;
      font-size: clamp(2.3rem, 8vw, 3.6rem); margin: 0.8rem 0 0.5rem;
      background: linear-gradient(120deg, #fff 0%, var(--accent) 50%, var(--accent-2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .tagline { font-family: var(--display); font-weight: 500; font-size: 1.1rem; color: var(--text-mid); }
    #page > section { margin-top: 2.8rem; margin-bottom: 0; }
    #page h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.35rem, 3.4vw, 1.7rem); letter-spacing: -0.01em; margin-bottom: 1rem; }
    .bio { white-space: pre-wrap; }
    .updates { display: grid; gap: 1rem; }
    .update { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem 1.3rem; position: relative; overflow: hidden; }
    .update::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--volt); }
    .u-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 0.9rem; display: block; }
    .u-date { font-family: var(--display); font-size: 0.8rem; font-weight: 500; color: var(--accent); }
    .u-title { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--text); margin: 0.15rem 0 0.45rem; }
    .u-body { color: var(--text-mid); line-height: 1.7; }
    .u-body > :first-child { margin-top: 0; }
    .u-body > :last-child { margin-bottom: 0; }
    .u-body p, .u-body ul, .u-body ol, .u-body blockquote { margin: 0 0 0.8em; }
    .u-body ul, .u-body ol { padding-left: 1.4em; }
    .u-body h3, .u-body h4, .u-body h5 { font-family: var(--display); color: var(--text); font-weight: 700; margin: 1em 0 0.4em; line-height: 1.3; }
    .u-body h3 { font-size: 1.12rem; } .u-body h4 { font-size: 1.02rem; } .u-body h5 { font-size: 0.95rem; }
    .u-body strong { color: var(--text); }
    .u-body a { color: var(--accent); }
    .u-body blockquote { border-left: 2px solid var(--accent); padding-left: 0.9em; color: var(--text-dim); }
    .u-body code { font-size: 0.85em; background: var(--glass-hi); padding: 0.1em 0.35em; border-radius: 4px; }
    .u-body hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
    .u-link { margin-top: 0.9rem; padding: 0.6rem 1.15rem; min-height: 0; font-size: 0.92rem; }
    .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.7rem; }
    .link {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.95rem 1.1rem;
      background: var(--glass); border: 1px solid var(--line); border-radius: 16px; color: var(--text); text-decoration: none;
      font-family: var(--display); font-weight: 600; font-size: 1rem; transition: transform 0.15s, background 0.2s, border-color 0.2s;
    }
    .link:hover { background: var(--glass-hi); border-color: rgba(var(--glow),0.5); transform: translateY(-2px); }
    .link > span:last-child { color: var(--text-dim); }
    .link-name { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
    .link-icon { width: 28px; height: 28px; flex-shrink: 0; }
    .feedback-cta {
      position: relative; padding: 2rem 1.6rem; text-align: center; border-radius: var(--radius); overflow: hidden;
      background: linear-gradient(var(--bg-2), var(--bg-2)) padding-box, var(--volt) border-box; border: 1.5px solid transparent;
    }
    .feedback-cta h2 { margin-bottom: 0.4rem !important; }
    .feedback-cta p { color: var(--text-mid); max-width: 440px; margin: 0 auto 1.2rem; }
    #page > footer { margin: 3.5rem -1.2rem 0; }
    .state { text-align: center; padding: 5rem 1rem; color: var(--text-mid); }
    .preview-bar {
      position: sticky; top: 0; z-index: 9500; text-align: center;
      padding: 0.55rem 1rem; font-size: 0.85rem; line-height: 1.4;
      background: #f5c542; color: #1a1400;
    }
    .preview-bar button {
      margin-left: 0.6rem; font: inherit; font-size: 0.8rem; cursor: pointer;
      background: rgba(0,0,0,0.12); color: inherit; border: 1px solid rgba(0,0,0,0.35);
      border-radius: 999px; padding: 0.1rem 0.7rem;
    }
    #audio-grid { margin-top: 0.5rem; }
  </style>
  <script src="/js/age-gate.js"></script>
</head>

  <div class="wrap" id="page"><div class="state">Loading…</div></div>

  <script src="/js/site-config.js"></script>
  <script src="/js/themes.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/link-icons.js"></script>
  <script src="/js/markdown.js"></script>
  <script>
  (function () {
    'use strict';
    var CFG = window.SITE_CONFIG;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
      });
    }
    // Profile text is written by creators, so it is escaped and only then given
    // line breaks and links. Nothing they type is ever treated as markup.
    function richText(s) {
      return esc(s).replace(/(https?:\/\/[^\s<]+)/g, function (u) {
        var trail = '', m = u.match(/[.,;:!?)\]]+$/);
        if (m) { trail = m[0]; u = u.slice(0, -trail.length); }
        return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>' + trail;
      }).replace(/\r?\n/g, '<br>');
    }

    // /profile/<slug>, or ?u=<slug> if the rewrite is not in play.
    function currentSlug() {
      var m = /\/profile\/([^/?#]+)/.exec(location.pathname);
      if (m) return decodeURIComponent(m[1]);
      return new URLSearchParams(location.search).get('u') || '';
    }

    function show(html) { document.getElementById('page').innerHTML = html; }

    function render(p) {
      document.title = p.name + ' · ' + CFG.identity.name;
      // Everyone but the site's owner is a collaborator, whose page belongs to
      // The Velvet Key collective: its bars, and its home in the footer.
      var collective = p.slug !== CFG.identity.owner;
      // SiteNav comes from js/electric.js at the foot of the page. A fetched
      // profile renders after it has loaded, but a preview renders straight
      // away, before the parser has reached it, so that waits for the page.
      if (collective) {
        var dress = function () { if (window.SiteNav) SiteNav.collective(p.slug); };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', dress);
        else dress();
      }
      // The site's own theme is the base look already, so only another one
      // goes on <body>.
      if (p.theme && p.theme !== 'electric') document.body.setAttribute('data-theme', p.theme);
      // A custom accent overrides the theme's, and has already been checked
      // server-side to be a colour and nothing else: #rgb, #rgba, #rrggbb or #rrggbbaa.
      if (p.accent) {
        var accent = Themes.accentFor(p.theme, p.accent);   // darker on Daylight if need be
        var hex = accent.replace('#', '');
        if (hex.length <= 4) hex = hex.slice(0, 3).replace(/./g, '$&$&');   // #rgb / #rgba
        var rgb = [0, 2, 4].map(function (i) { return parseInt(hex.substr(i, 2), 16); }).join(',');
        var st = document.body.style;
        ['--accent', '--accent-2', '--cyan', '--violet', '--pink'].forEach(function (v) { st.setProperty(v, accent); });
        st.setProperty('--volt', 'linear-gradient(120deg, ' + accent + ', ' + accent + ')');
        if (/^[\d,]+$/.test(rgb)) st.setProperty('--glow', rgb);
      }
      // The background behind the page. "banner" needs a banner to show, so
      // without one it stays the default glow. The URL is quoted with its own
      // quotes and line breaks removed, so it cannot close the url().
      if (p.background === 'plain') document.body.setAttribute('data-bg', 'plain');
      if (p.background === 'banner' && p.banner) {
        document.body.style.setProperty('--bg-image', 'url("' + String(p.banner).replace(/["\\\r\n]/g, '') + '")');
        document.body.setAttribute('data-bg', 'banner');
      }

      var sections = p.sections || {};
      var html = '';

      if (p.banner) html += '<div class="banner" style="background-image:url(\'' + esc(p.banner) + '\')"></div>';
      html += '<div class="head">';
      if (p.avatar) html += '<img class="avatar" src="' + esc(p.avatar) + '" alt="">';
      html += '<h1>' + esc(p.name) + '</h1>';
      if (p.tagline) html += '<div class="tagline">' + esc(p.tagline) + '</div>';
      html += '</div>';

      // A creator's own news sits at the top, where news belongs.
      var updates = (p.updates || []).slice(0, 10);
      if (sections.updates !== false && updates.length) {
        html += '<section><h2>Latest</h2><div class="updates">' +
          updates.map(function (u) {
            var head = '';
            if (u.date) head += '<div class="u-date">' + esc(u.date) + '</div>';
            if (u.title) head += '<div class="u-title">' + esc(u.title) + '</div>';
            return '<article class="update">' +
              (u.image ? '<img class="u-img" src="' + esc(u.image) + '" alt="" loading="lazy">' : '') +
              head +
              (u.body ? '<div class="u-body">' + Markdown.render(u.body) + '</div>' : '') +
              (u.link ? '<a class="u-link btn btn-glass" href="' + esc(u.link) + '" target="_blank" rel="noopener noreferrer">' +
                esc(u.linkLabel || 'Read more') + ' &#8599;</a>' : '') +
              '</article>';
          }).join('') + '</div></section>';
      }

      if (sections.about !== false && p.bio) {
        html += '<section><h2>About</h2><div class="bio glass">' + richText(p.bio) + '</div></section>';
      }
      if (sections.works !== false) {
        html += '<section><h2>Works</h2><div id="audio-grid"></div></section>';
      }
      if (sections.links !== false && (p.links || []).length) {
        html += '<section><h2>Find Me</h2><div class="links">' +
          p.links.map(function (l) {
            var logo = window.LinkIcons ? LinkIcons.html(l.url) : '';
            return '<a class="link" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
              '<span class="link-name">' + (logo ? '<span class="link-icon">' + logo + '</span>' : '') +
              esc(l.label) + '</span><span>&#8599;</span></a>';
          }).join('') + '</div></section>';
      }
      if (sections.feedback !== false) {
        html += '<section><div class="feedback-cta"><h2>Tell ' + esc(p.name) + ' what you thought</h2>' +
          '<p>It&rsquo;s anonymous, takes a couple of minutes, and they read every response.</p>' +
          '<a class="btn btn-primary" href="/feedback.html?for=' + encodeURIComponent(p.slug) + '">Leave feedback</a></div></section>';
      }
      html += '<footer>' + (collective ? '<a href="/consenting-adults.html">The Velvet Key</a>' : '<a href="/">' + esc(CFG.identity.name) + '</a>') + ' &middot; 18+ only</footer>';

      show(html);

      if (sections.works !== false && window.AudioGrid) {
        // A creator who is not in site-config's artist list is still credited
        // under their display name, so teach the matcher that before asking.
        CFG.registerArtistName(p.slug, p.name);
        (p.aliases || []).forEach(function (a) { CFG.registerArtistName(p.slug, a); });
        AudioGrid.init({ container: '#audio-grid', artist: p.slug });
      }

      // Offered only to whoever may change this profile, and outside the works
      // section: a creator who has turned that section off still owns the page.
      if (window.AudioGrid) AudioGrid.profileEditor({ slug: p.slug });
    }

    var slug = currentSlug();
    if (!slug) {
      show('<div class="state">No profile named.</div>');
      return;
    }

    // ?preview=1: the Content Manager's Preview button. It hands over what is
    // on the editor's screen right now — saved or not, published or not —
    // through this browser's storage, so a creator sees their page before
    // anyone else can. Nothing is fetched or saved, and the page is the same
    // escaped render as the real one.
    if (new URLSearchParams(location.search).get('preview') === '1') {
      var meta = document.createElement('meta');
      meta.name = 'robots'; meta.content = 'noindex';
      document.head.appendChild(meta);
      var draft = null;
      try { draft = JSON.parse(localStorage.getItem('cm_profile_preview') || 'null'); } catch (e) {}
      if (!draft || !draft.profile || draft.profile.slug !== slug) {
        show('<div class="state">Nothing to preview. Open this from the Preview button in the Content Manager.</div>');
        return;
      }
      var bar = document.createElement('div');
      bar.className = 'preview-bar';
      bar.innerHTML = '<strong>Preview</strong> &mdash; only you can see this. ' +
        (draft.profile.published ? 'Your page is live; unsaved changes are not.' : 'Your page is not published yet.') +
        ' <button type="button" onclick="window.close()">Close preview</button>';
      document.body.insertBefore(bar, document.body.firstChild);
      render(draft.profile);
      // Pressing Preview again in the editor refreshes this tab.
      window.addEventListener('storage', function (e) {
        if (e.key === 'cm_profile_preview') location.reload();
      });
      return;
    }

    fetch('/api/profile/' + encodeURIComponent(slug))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok || !data.profile) {
          show('<div class="state">There is no profile here yet.</div>');
          return;
        }
        render(data.profile);
      })
      .catch(function () { show('<div class="state">Could not load this profile.</div>'); });
  })();
  </script>
